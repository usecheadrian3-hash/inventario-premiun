<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categorías</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .cat-card { background:var(--bg-card-alt); border:1px solid var(--border); border-radius:var(--radius-md); padding:1rem; display:flex; align-items:center; justify-content:space-between; transition:all 0.2s; }
        .cat-card:hover { border-color:rgba(167,139,250,0.3); }
    </style>
</head>
<body>
<canvas id="bgCanvas"></canvas><div class="orb orb1"></div><div class="orb orb2"></div>
<div class="topbar">
    <div class="topbar-logo"><div class="topbar-logo-icon">📂</div><span class="topbar-logo-text">Categorías</span></div>
    <div class="topbar-divider"></div>
    <div class="topbar-center"><a href="{{ url_for('blog') }}" class="topbar-nav-btn">← Dashboard</a></div>
    <div class="topbar-right"><span class="role-badge">{{ usuario[6] }}</span></div>
</div>
<div class="main">
    <div class="page-header"><div class="main-titulo">📂 Categorías <small>Gestiona las categorías de productos</small></div></div>
    <div class="section-card">
        <div class="section-card-header"><div class="section-card-icon">➕</div><span class="section-card-title">Nueva Categoría</span></div>
        <div class="section-card-body">
            <form class="form-agregar" action="{{ url_for('agregar_categoria') }}" method="POST">
                <div class="form-grid" style="grid-template-columns:1fr 2fr;">
                    <input type="text" name="nombre" placeholder="Nombre" required autocomplete="off">
                    <input type="text" name="descripcion" placeholder="Descripción" autocomplete="off">
                </div>
                <button type="submit" class="btn-agregar">✦ Crear categoría</button>
            </form>
        </div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:0.8rem;">
        {% for c in categorias %}
        <div class="cat-card">
            <div>
                <div style="font-weight:700;color:var(--text);">{{ c[1] }}</div>
                <div style="font-size:0.75rem;color:var(--text-muted);margin-top:0.2rem;">{{ c[2] or 'Sin descripción' }}</div>
            </div>
            <a href="{{ url_for('eliminar_categoria', id=c[0]) }}" class="btn-eliminar" onclick="return confirm('¿Eliminar categoría?')">🗑 </a>
        </div>
        {% endfor %}
        {% if not categorias %}
        <div style="grid-column:1/-1;text-align:center;color:var(--text-muted);padding:2rem;">No hay categorías creadas</div>
        {% endif %}
    </div>
</div>
<script src="{{ url_for('static', filename='script.js') }}"></script>
<script>
const c=document.getElementById('bgCanvas'),cx=c.getContext('2d');
function r(){c.width=window.innerWidth;c.height=window.innerHeight;}r();window.addEventListener('resize',r);
const stars=Array.from({length:80},()=>({x:Math.random()*window.innerWidth,y:Math.random()*window.innerHeight,r:Math.random()*1.2+0.2,phase:Math.random()*Math.PI*2,speed:Math.random()*0.005+0.002,color:['#ffffff','#aaddff','#d4aaff'][Math.floor(Math.random()*3)]}));
let t=0;(function loop(){t+=0.01;cx.clearRect(0,0,c.width,c.height);stars.forEach(s=>{const a=0.3+0.7*Math.abs(Math.sin(t*s.speed*12+s.phase));cx.beginPath();cx.arc(s.x%c.width,s.y%c.height,s.r,0,Math.PI*2);cx.fillStyle=s.color;cx.globalAlpha=a;cx.fill();});cx.globalAlpha=1;requestAnimationFrame(loop);})();
</script>
</body>
</html>
